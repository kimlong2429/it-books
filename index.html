<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện PDF Tự Động</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117; color: #c9d1d9;
            display: flex; height: 100vh; overflow: hidden;
        }
        #sidebar {
            width: 320px; background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex; flex-direction: column;
        }
        .header { padding: 16px; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 1.1rem; color: #58a6ff; }
        .file-tree { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .folder { margin-bottom: 12px; }
        .folder-title {
            font-weight: 600; font-size: 0.9rem; color: #8b949e;
            padding: 6px 8px; display: flex; align-items: center; gap: 6px;
        }
        .folder-title::before { content: "📁"; }
        .file-list { list-style: none; padding-left: 12px; }
        .file-item { margin: 2px 0; }
        .file-link {
            display: flex; align-items: center; gap: 6px; padding: 6px 10px;
            color: #c9d1d9; text-decoration: none; font-size: 0.85rem;
            border-radius: 6px; transition: background 0.2s; word-break: break-word;
        }
        .file-link::before { content: "📄"; }
        .file-link:hover { background-color: #21262d; color: #58a6ff; }
        .file-link.active { background-color: #1f6feb; color: #ffffff; }
        #main-content { flex: 1; display: flex; flex-direction: column; }
        #top-bar {
            height: 45px; border-bottom: 1px solid #30363d; display: flex;
            align-items: center; padding: 0 16px; font-size: 0.85rem;
            color: #8b949e; background-color: #161b22;
        }
        #viewer-frame { flex: 1; width: 100%; height: 100%; border: none; }
        .placeholder {
            flex: 1; display: flex; align-items: center;
            justify-content: center; color: #8b949e; font-size: 0.95rem;
        }
        .loading { padding: 16px; color: #8b949e; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>📚 Thư viện PDF</h1>
        </div>
        <div class="file-tree" id="tree-container">
            <div class="loading" id="loading-text">🔄 Đang tải danh mục từ GitHub...</div>
        </div>
    </div>

    <div id="main-content">
        <div id="top-bar">Đang xem: <span id="current-file" style="margin-left: 8px; color: #c9d1d9;">Chưa chọn file</span></div>
        <div id="view-container" style="flex: 1; display: flex;">
            <div class="placeholder" id="placeholder-text">Vui lòng chọn một file PDF ở danh mục bên trái</div>
            <iframe id="viewer-frame" style="display: none;"></iframe>
        </div>
    </div>

    <script>
        // Tự động lấy USERNAME và REPO_NAME từ URL của GitHub Pages
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const username = window.location.hostname.split('.')[0];
        const repoName = pathSegments[0] || '';

        const treeContainer = document.getElementById('tree-container');
        const iframe = document.getElementById('viewer-frame');
        const placeholder = document.getElementById('placeholder-text');
        const currentFileText = document.getElementById('current-file');

        async function fetchRepoTree() {
            try {
                // Gọi API lấy cây thư mục nhánh main/master
                const response = await fetch(`https://api.github.com/repos/${username}/${repoName}/git/trees/main?recursive=1`);
                if (!response.ok) throw new Error('Không thể tải cây thư mục từ API GitHub');

                const data = await response.json();
                renderTree(data.tree);
            } catch (err) {
                treeContainer.innerHTML = `<div class="loading" style="color: #f85149;">❌ Lỗi: ${err.message}</div>`;
            }
        }

        function renderTree(tree) {
            treeContainer.innerHTML = '';
            
            // Lọc ra các file PDF nằm trong thư mục
            const pdfFiles = tree.filter(item => item.type === 'blob' && item.path.endsWith('.pdf'));
            
            // Nhóm theo thư mục
            const folderMap = {};
            pdfFiles.forEach(file => {
                const parts = file.path.split('/');
                if (parts.length > 1) {
                    const folderName = parts.slice(0, -1).join('/');
                    const fileName = parts[parts.length - 1];
                    if (!folderMap[folderName]) folderMap[folderName] = [];
                    folderMap[folderMap[folderName].push({ name: fileName, fullPath: file.path })];
                }
            });

            // Hiển thị HTML
            Object.keys(folderMap).forEach(folderName => {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'folder-title';
                titleDiv.textContent = folderName;
                folderDiv.appendChild(titleDiv);

                const ul = document.createElement('ul');
                ul.className = 'file-list';

                folderMap[folderName].forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-item';

                    const a = document.createElement('a');
                    a.href = '#';
                    a.className = 'file-link';
                    a.textContent = file.name;
                    a.dataset.pdf = file.fullPath;

                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        document.querySelectorAll('.file-link').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');

                        iframe.src = encodeURI(file.fullPath);
                        iframe.style.display = 'block';
                        placeholder.style.display = 'none';
                        currentFileText.textContent = file.fullPath;
                    });

                    li.appendChild(a);
                    ul.appendChild(li);
                });

                folderDiv.appendChild(ul);
                treeContainer.appendChild(folderDiv);
            });
        }

        fetchRepoTree();
    </script>
</body>
</html>
