<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện PDF Tự Động</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117; color: #c9d1d9;
        }
        
        /* Layout chính */
        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 300px;
            min-width: 300px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex; flex-direction: column;
            transition: margin-left 0.3s ease;
        }
        
        /* Khi ẩn Sidebar */
        #sidebar.collapsed {
            margin-left: -300px;
        }

        .header { padding: 14px; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 1rem; color: #58a6ff; }
        .file-tree { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .folder { margin-bottom: 10px; }
        .folder-title {
            font-weight: 600; font-size: 0.85rem; color: #8b949e;
            padding: 6px 8px; display: flex; align-items: center; gap: 6px;
        }
        .folder-title::before { content: "📁"; }
        .file-list { list-style: none; padding-left: 12px; }
        .file-item { margin: 2px 0; }
        .file-link {
            display: flex; align-items: center; gap: 6px; padding: 6px 10px;
            color: #c9d1d9; text-decoration: none; font-size: 0.85rem;
            border-radius: 6px; transition: background 0.2s; word-break: break-word;
        }
        .file-link::before { content: "📄"; }
        .file-link:hover { background-color: #21262d; color: #58a6ff; }
        .file-link.active { background-color: #1f6feb; color: #ffffff; }

        /* Main Content Viewport */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
        }

        /* Topbar Controls */
        #top-bar {
            height: 40px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 0.85rem;
            color: #8b949e;
            background-color: #161b22;
        }

        .btn-control {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-control:hover {
            background-color: #30363d;
            color: #58a6ff;
        }

        /* Frame đọc PDF hiển thị 100% Viewport còn lại */
        #view-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 40px);
            position: relative;
        }

        #viewer-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            font-size: 0.95rem;
        }
        .loading { padding: 16px; color: #8b949e; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="header">
                <h1>📚 Thư viện PDF</h1>
            </div>
            <div class="file-tree" id="tree-container">
                <div class="loading">🔄 Đang tải danh mục...</div>
            </div>
        </div>

        <!-- Main Viewport -->
        <div id="main-content">
            <div id="top-bar">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn-control" id="toggle-sidebar" title="Ẩn/Hiện Sidebar">☰ Danh mục</button>
                    <span>Đang xem: <strong id="current-file" style="color: #c9d1d9;">Chưa chọn file</strong></span>
                </div>
                <div>
                    <button class="btn-control" id="btn-fullscreen" title="Mở tràn toàn màn hình">⛶ Toàn màn hình</button>
                </div>
            </div>

            <div id="view-container">
                <div class="placeholder" id="placeholder-text">Vui lòng chọn một file PDF ở danh mục bên trái</div>
                <iframe id="viewer-frame" style="display: none;"></iframe>
            </div>
        </div>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const username = window.location.hostname.split('.')[0];
        const repoName = pathSegments[0] || '';

        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const fullscreenBtn = document.getElementById('btn-fullscreen');
        const viewContainer = document.getElementById('view-container');
        const treeContainer = document.getElementById('tree-container');
        const iframe = document.getElementById('viewer-frame');
        const placeholder = document.getElementById('placeholder-text');
        const currentFileText = document.getElementById('current-file');

        // Toggle Sidebar
        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Toggle Fullscreen Viewport Mode
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                viewContainer.requestFullscreen().catch(err => {
                    alert(`Không thể mở toàn màn hình: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Load GitHub Repo PDF Tree
        async function fetchRepoTree() {
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repoName}/git/trees/main?recursive=1`);
                if (!response.ok) throw new Error('Không thể lấy cây thư mục');
                const data = await response.json();
                renderTree(data.tree);
            } catch (err) {
                treeContainer.innerHTML = `<div class="loading" style="color:#f85149;">❌ Lỗi tải danh mục</div>`;
            }
        }

        function renderTree(tree) {
            treeContainer.innerHTML = '';
            const pdfFiles = tree.filter(item => item.type === 'blob' && item.path.endsWith('.pdf'));
            
            const folderMap = {};
            pdfFiles.forEach(file => {
                const parts = file.path.split('/');
                if (parts.length > 1) {
                    const folderName = parts.slice(0, -1).join('/');
                    const fileName = parts[parts.length - 1];
                    if (!folderMap[folderName]) folderMap[folderName] = [];
                    folderMap[folderName].push({ name: fileName, fullPath: file.path });
                }
            });

            Object.keys(folderMap).forEach(folderName => {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'folder-title';
                titleDiv.textContent = folderName;
                folderDiv.appendChild(titleDiv);

                const ul = document.createElement('ul');
                ul.className = 'file-list';

                folderMap[folderName].forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-item';

                    const a = document.createElement('a');
                    a.href = '#';
                    a.className = 'file-link';
                    a.textContent = file.name;

                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        document.querySelectorAll('.file-link').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');

                        // Mở PDF và tự động ẩn Sidebar để tràn Viewport
                        iframe.src = encodeURI(file.fullPath);
                        iframe.style.display = 'block';
                        placeholder.style.display = 'none';
                        currentFileText.textContent = file.name;
                    });

                    li.appendChild(a);
                    ul.appendChild(li);
                });

                folderDiv.appendChild(ul);
                treeContainer.appendChild(folderDiv);
            });
        }

        fetchRepoTree();
    </script>
</body>
</html>
